name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Native OpenTUI test
        run: npm run test:cli-opentui
      - name: Package consumer compatibility
        run: npm run test:package-consumer
      - name: Test
        run: npm test -- --runInBand --forceExit
  yarn-lock:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies from the Yarn lockfile
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
